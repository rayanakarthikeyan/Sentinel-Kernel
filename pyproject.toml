[build-system]
requires = [setuptools>=61.0]
build-backend = setuptools.build_meta

[project]
name = sentinel-kernel
version = 0.1.0
description = Autonomous SRE & Self-Healing Incident Agent with Isolated Sandbox Verification
readme = README.md
requires-python = >=3.10
authors = [
    { name = Rayana Karthikeyan, email = rayanakarthikeyan@gmail.com }
]
dependencies = [
    pydantic>=2.5.0,
    fastapi>=0.110.0,
    uvicorn>=0.28.0,
    httpx>=0.27.0,
    jinja2>=3.1.2,
    rich>=13.7.0
]

[project.optional-dependencies]
dev = [
    pytest>=8.0.0,
    pytest-asyncio>=0.23.0
]
